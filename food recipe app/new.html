<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Food Recipe website</title>
    <link rel="stylesheet" href="index.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto&display=swap" rel="stylesheet">
    <script src="https://kit.fontawesome.com/f30fac2c61.js" crossorigin="anonymous"></script>
</head>
<body>
    <div class="container">
        <nav>
            <div class="logo">
                <h1>Meal Finder</h1>
            </div>
            <div class="searchBar">
                <input type="text" placeholder="Search Here" id="searchInput">
                <!-- Search icon added inside the button -->
                <button id="searchBtn"><i class="fa-solid fa-search"></i></button>
            </div>
        </nav>

        <!-- Dish Types Section -->
        <div class="dishTypes">
            <div id="category">
                <!-- < and > symbol added as buttons for slider -->
                <button id="prevBtn"><</button>
                <div class="dishName">
                    <input type="button" class="dish" value="Cake">
                    <input type="button" class="dish" value="Biryani">
                    <input type="button" class="dish" value="Cream">
                </div>
                <div class="dishName">
                    <input type="button" class="dish" value="Chicken">
                    <input type="button" class="dish" value="Biryani">
                    <input type="button" class="dish" value="Ice Cream">
                </div>
                <div class="dishName">
                    <input type="button" class="dish" value="Salad">
                    <input type="button" class="dish" value="Samosa">
                    <input type="button" class="dish" value="Banana">
                </div>
                <button id="nextBtn">></button>
            </div>
        </div>

        <!-- Show Meal Section -->
        <div class="showMeal"></div>
    </div>

    <script src="index.js"></script>
</body>
</html>
